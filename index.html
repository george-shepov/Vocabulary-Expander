<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary Expander</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main>
      <h1>Vocabulary Expander</h1>
      <p>
        Load text (TXT, Markdown, DOCX, PDF), click unfamiliar words, and build flashcards with
        definitions, synonyms, antonyms, examples, and translations.
      </p>

      <section class="panel">
        <h2>1) Load text</h2>
        <div class="controls">
          <label>
            Sample text
            <select id="sample-text-selector">
              <option value="">Choose a sample...</option>
              <option value="short">Short page-level sample</option>
              <option value="medium">Medium chapter-level sample</option>
              <option value="long">Long classic-book excerpt</option>
            </select>
          </label>
          <button id="load-sample" type="button">Load sample</button>
        </div>

        <div class="controls">
          <label for="file-input">Upload file (.txt, .md, .docx, .pdf)</label>
          <input id="file-input" type="file" accept=".txt,.md,.markdown,.docx,.pdf" />
        </div>

        <label for="text-input">Or paste your own text</label>
        <textarea id="text-input" rows="10" placeholder="Paste any English text here..."></textarea>
        <div class="controls">
          <button id="render-text" type="button">Render selectable words</button>
        </div>
      </section>

      <section class="panel">
        <h2>2) Select words</h2>
        <p>Click any word below to create a flashcard.</p>
        <div id="tokenized-text" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>3) Flashcards</h2>
        <label for="language-selector">Translation language</label>
        <select id="language-selector">
          <option value="en" selected>English (definitions, synonyms, antonyms)</option>
          <option value="ru">Russian</option>
          <option value="es">Spanish</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="zh-CN">Chinese</option>
          <option value="uk">Ukrainian</option>
        </select>
        <div id="flashcards" aria-live="polite"></div>
      </section>
    </main>

    <script src="./node_modules/mammoth/mammoth.browser.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
